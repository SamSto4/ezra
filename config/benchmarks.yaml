# Benchmark checks: the deterministic part of judging an output against
# docs/reference-outputs/ (D-001). Read by ezra.benchmarks.
#
# Two kinds of result:
#   gates    - hard rules taken from existing contracts and decisions (intake's problems_with,
#              the Standards template, D-006, D-014, pricing.yaml arithmetic). A gate failure
#              means the output is broken.
#   warnings - the reference files' checklists turned into cheap text checks. They never block
#              anything; they're logged so we can see how often agents miss the checklist.
#
# Every value marked GUESS is a first-version heuristic, not a measured threshold.
# Revisit them once real outputs have been scored (M6 traces make that possible).
# Changing this file doesn't change any verdict: nothing here feeds the D-002 table.
# v2 (2026-11-21): tuned against the first 8 real intakes (see docs/benchmarks.md, "Tuning v2").
version: "2"

acceptance_criteria:
  # Reference checklist says 3-6; intake's hard rule (problems_with) stays 2-8.
  # Only criteria a model has to work on count: `deterministic` ones (tests_pass, lint) are
  # free checks (D-007), so they don't count toward this range.
  min_criteria: 3
  max_criteria: 6
  max_title_chars: 60
  max_description_sentences: 3
  # Words that make a criterion untestable (turn into cannot_verify under D-002). The first 11
  # come from the weak reference example; the rest are the usual "weak words" of requirements
  # writing (ISO/IEC/IEEE 29148). Text inside quotes or backticks is ignored before matching,
  # so word_count("fast") is never flagged. v2: 0 hits on the 38 real criteria so far.
  vague_phrases:
    - works correctly
    - correctly handles
    - gracefully
    - best practices
    - robust
    - clean code
    - comprehensive
    - efficiently
    - as expected
    - properly
    - well documented
    - appropriate
    - appropriately
    - adequate
    - sufficient
    - reasonable
    - user-friendly
    - intuitive
    - easy to
    - seamless
    - fast
    - quickly
    - flexible
    - etc
    - and so on
    - if possible
    - as needed
    - where necessary
    - various
    - edge cases
    - any input
    - all inputs
    - valid input
    - handles errors
  # A `test` criterion is concrete when it names something to exercise (a call, a code span or
  # a quoted input) AND an observable result. The words that count as a result:
  result_words: [returns, return, returned, raises, raise, prints, print, outputs, output,
                 writes, write, equals, equal, yields, yield, exits, exit, importable, imported]

standards:
  # Sections every Standard needs to be ruled on. The template's other sections are warnings.
  required_sections: [Requirement, Rationale, Passing conditions, Failure conditions]
  # GUESS: phrases that push outputs longer without a measurable gain.
  length_phrases: [in detail, comprehensive, thorough, at all times, as much as possible]
  # GUESS: a Requirement over this many sentences is probably more than one requirement.
  max_requirement_sentences: 1

answers:
  # Only the cheap, deterministic part of the Quality Rubric (F Clarity, G Presentation).
  # Accuracy, task achievement and reasoning need Guardian's judgement (Tier 3).
  # Preambles are looked for in the first sentence only; sign-offs in the last paragraph only.
  # Started from the weak reference answer, widened in v2 with common filler openers/closers.
  preamble_phrases: ["great question", "good question", "excellent question", "let's walk through",
                     "don't worry", "i'd be happy to", "happy to help", "certainly!", "sure!",
                     "absolutely!", "of course!", "let's dive in", "let's break this down",
                     "i'll walk you through"]
  signoff_phrases: ["i hope this helps", "hope this helps", "hope that helps", "let me know if",
                    "feel free to", "happy coding", "good luck", "don't hesitate to",
                    "is there anything else", "any other questions", "happy to help further",
                    "cheers"]
  # An answer with fewer prose words than this (code blocks not counted) shouldn't need
  # markdown headings. 300 words is about one 80x24 terminal screen, where Ezra's answers are read.
  short_answer_words: 300

model_evals:
  min_runs_for_spread: 3   # D-012
  cost_tolerance_usd: 0.00001
  statuses: [candidate, evaluating, qualified, rejected, retired]
