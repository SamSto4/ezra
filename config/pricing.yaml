# Model prices in USD per million tokens. Used by the Gateway for cost logging and budget checks.
# Source: Claude API reference (models.md, prompt-caching.md), checked 2026-11-20.
# cache_write is the 5-minute TTL write price (1.25 x input). Ezra only uses 5-minute caching.
# fallbacks: the models the server may switch to on a refusal (`fallbacks: "default"`),
#   read from /v1/models allowed_fallback_models on 2026-11-20. Budget checks price the
#   worst case at the most expensive of the model and its fallbacks.
# A model missing here can't be called: the Gateway refuses to start without a price.
version: "2026-11-20"
models:
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00,
                      fallbacks: [claude-opus-4-8, claude-opus-5]}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50,
                      fallbacks: [claude-sonnet-5]}
  # Fallback targets
  claude-opus-5:     {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-8:   {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-sonnet-5:   {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
