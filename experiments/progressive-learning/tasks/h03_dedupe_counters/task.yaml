id: h03_dedupe_counters
category: refactor
split: heldout
description: count_vowels and count_consonants in minitext/stats.py repeat the same loop. Add a shared
  helper count_matching(text, predicate) and rewrite both on top of it, without changing their behavior.
criteria:
- id: AC1
  text: minitext.stats has count_matching(text, predicate) that counts the characters of text for which
    predicate returns True
  severity: major
  verification: test
- id: AC2
  text: count_vowels and count_consonants use count_matching instead of their own loops
  severity: major
  verification: inspection
- id: AC3
  text: count_vowels and count_consonants return exactly what they did before, including for uppercase
    letters
  severity: critical
  verification: test
- id: AC9
  text: All existing tests in tests/ still pass
  severity: major
  verification: deterministic
  check: tests_pass
constraints:
- No new dependencies
