id: h04_longest_word_cleanup
category: refactor
split: heldout
description: 'Clean up longest_word in minitext/stats.py: add type hints and a docstring and simplify
  it, keeping its behavior (first word wins a tie, empty text gives an empty string).'
criteria:
- id: AC1
  text: longest_word has type hints for its parameter and return value, and a docstring
  severity: major
  verification: inspection
- id: AC2
  text: The first of several equally long words is returned
  severity: critical
  verification: test
- id: AC3
  text: Empty or whitespace-only text returns an empty string
  severity: major
  verification: test
- id: AC9
  text: All existing tests in tests/ still pass
  severity: major
  verification: deterministic
  check: tests_pass
constraints:
- No new dependencies
